x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-inbox}:${POSTGRES_PASSWORD:-inbox_secret}@postgres:5432/${POSTGRES_DB:-unified_inbox}

  NEXTAUTH_URL:    ${NEXTAUTH_URL:-http://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}          

  GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}    # required — set in .env
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}# required — set in .env

  SLACK_CLIENT_ID:      ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET:  ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  SLACK_BOT_TOKEN:      ${SLACK_BOT_TOKEN:-}

  GROQ_API_KEY: ${GROQ_API_KEY}               

  KAFKA_BROKER:             kafka:9092
  KAFKA_REPLICATION_FACTOR: "1"              

  WS_PORT:              "3001"
  NEXT_PUBLIC_WS_URL:   ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
  WS_URL:               ${WS_URL:-http://worker:3001}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbox_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-unified_inbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inbox} -d ${POSTGRES_DB:-unified_inbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inbox_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - inbox_net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:               zookeeper:2181
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:            INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:  INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:      INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:   1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:       "true"
      KAFKA_LOG_RETENTION_HOURS:             48
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9093:9093"   
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - inbox_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: ["./docker-entrypoint-web.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/auth/providers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - inbox_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: production
    ports:
      - "3001:3001"   
    command: ["./docker-entrypoint-worker.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f 'http://localhost:3001/socket.io/?EIO=4&transport=polling' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - inbox_net

volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:

networks:
  inbox_net:
    driver: bridge