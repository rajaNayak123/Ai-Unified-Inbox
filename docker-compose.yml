x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-inbox}:${POSTGRES_PASSWORD:-inbox_secret}@postgres:5432/${POSTGRES_DB:-unified_inbox}

  NEXTAUTH_URL:    ${NEXTAUTH_URL:-http://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

  GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

  SLACK_CLIENT_ID:      ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET:  ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  SLACK_BOT_TOKEN:      ${SLACK_BOT_TOKEN:-}

  GROQ_API_KEY: ${GROQ_API_KEY}

  # Points to your Mac's host machine where Homebrew Kafka is running
  KAFKA_BROKER:             host.docker.internal:9092
  KAFKA_REPLICATION_FACTOR: "1"

  WS_PORT:              "3001"
  NEXT_PUBLIC_WS_URL:   ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
  WS_URL:               ${WS_URL:-http://worker:3001}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-inbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbox_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-unified_inbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inbox} -d ${POSTGRES_DB:-unified_inbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inbox_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: production
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["./docker-entrypoint-web.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/auth/providers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - inbox_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: production
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["./docker-entrypoint-worker.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f 'http://localhost:3001/socket.io/?EIO=4&transport=polling' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - inbox_net

volumes:
  postgres_data:

networks:
  inbox_net:
    driver: bridge